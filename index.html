<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CABO</title><style>body{background:#123e37;color:#fff;font:17px system-ui;max-width:680px;margin:auto;padding:20px}h1{font-size:48px;letter-spacing:8px;color:#f5d38b}button,input{font:inherit;padding:12px;border:0;border-radius:9px;margin:5px}button{background:#f5d38b;color:#182e29;cursor:pointer}section{background:#ffffff13;padding:12px;border-radius:14px;margin:12px 0}.cards{display:flex;gap:5px}.card{width:54px;height:78px;background:#fff8e7;color:#123e37;font-size:26px;font-weight:bold}.back{background:#326b81;color:white;border:2px solid #b8d2da}small{color:#d0e5db}</style><h1>CABO</h1><div id="login"><input id="name" placeholder="Dein Name"><input id="room" placeholder="Raumcode"><button onclick="join('create')">Raum erstellen</button><button onclick="join('join')">Beitreten</button></div><div id="game"></div><p id="error"></p><script>let s=null,busy=false,own=0;const $=id=>document.getElementById(id);$('room').value=new URLSearchParams(location.search).get('room')||'';async function call(action,extra={}){if(busy)return;busy=true;try{let res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,room:s?.room||$('room').value,token:s?.token,...extra})});let n=await res.json();if(n.error)throw Error(n.error);s=n;$('login').hidden=true;$('error').textContent='';render()}catch(e){$('error').textContent=e.message}finally{busy=false}}function join(a){call(a,{name:$('name').value||'Spieler'})}function btn(t,a){let b=document.createElement('button');b.textContent=t;b.onclick=a;return b}function render(){let g=$('game');g.replaceChildren();let p=document.createElement('p');p.textContent='Raum '+s.room+' · '+s.message;g.append(p);g.append(btn('WhatsApp-Einladung',()=>window.open('https://wa.me/?text='+encodeURIComponent('Spiele CABO mit mir! '+location.origin+'/?room='+s.room),'_blank')));for(let [j,x] of s.players.entries()){let sec=document.createElement('section'),h=document.createElement('div');h.textContent=x.name+(j===s.i?' (Du)':'')+' · '+x.score+' Punkte'+(s.phase==='play'&&s.turn===j?' · am Zug':'');sec.append(h);let row=document.createElement('div');row.className='cards';x.cards.forEach((v,k)=>{let b=btn(v===null?'◆':v,()=>{if(s.turn!==s.i)return;if(s.power==='switch'&&j===s.i){own=k;return}if(s.power&&s.power!=='done')call('power',{player:j,card:k,own});else if(j===s.i&&s.held!==null)call('swap',{card:k})});b.className='card '+(v===null?'back':'');row.append(b)});sec.append(row);g.append(sec)}if((s.phase==='lobby'||s.phase==='end')&&s.i===0)g.append(btn('Runde starten',()=>call('start')));if(s.phase==='peek'&&!s.ready)g.append(btn('Karten gemerkt',()=>call('ready')));if(s.phase==='play'&&s.turn===s.i){let p=document.createElement('p');p.textContent='Ablage: '+(s.discard??'leer')+' · Gezogene Karte: '+(s.held??'–');g.append(p);if(s.power){let t=document.createElement('p');t.textContent={peek:'Wähle eine eigene Karte',spy:'Wähle eine fremde Karte',switch:'Wähle erst eine eigene, dann eine fremde Karte',done:'Merke dir die Karte'}[s.power];g.append(t,btn('Weiter / überspringen',()=>call('skip')))}else if(s.held!==null){g.append('Tippe auf eine eigene Karte zum Tauschen.');if(s.source==='draw')g.append(btn('Abwerfen',()=>call('discard')))}else{g.append(btn('Verdeckt ziehen',()=>call('draw')),btn('Ablage nehmen',()=>call('take')));if(s.caller===null)g.append(btn('CABO!',()=>call('cabo')))}}}setInterval(()=>{if(s)call('state')},1500)</script></html>
